name: Deploy to Cloud Run

# master への push（＝人間によるレビュー・pushを経た本番反映）をトリガーに
# 自動デプロイする。workflow_dispatch は手動再実行・動作確認用。
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PROJECT_ID: webprog36
  REGION: asia-northeast1
  SERVICE: miyabi
  REPOSITORY: miyabi
  IMAGE: web

permissions:
  contents: read
  id-token: write # Workload Identity Federation に必須

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # バージョン算出（push間のコミット数）に全履歴が必要

      - name: Compute version
        # X.Y.Z の X は package.json のメジャー値（人間が変更）、
        # Y は master への push 回数（このワークフローの run number）、
        # Z はこの push に含まれるコミット数（push のたびに 0 から数え直す）。
        run: |
          cd web
          X=$(node -p "require('./package.json').version.split('.')[0]")
          Y="${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            Z=$(git rev-list --count ${{ github.event.before }}..${{ github.event.after }})
          else
            Z=0
          fi
          echo "APP_VERSION=$X.$Y.$Z" >> "$GITHUB_ENV"
          echo "computed version: $X.$Y.$Z"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/294448459831/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@webprog36.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: web
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE_TAG" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --update-env-vars "APP_VERSION=${{ env.APP_VERSION }}"
          # DATABASE_URL/TURSO_AUTH_TOKEN/ADMIN_USER/ADMIN_PASSWORD は
          # 既存リビジョンの設定（Secret Manager参照含む）を自動的に引き継ぐ
          # （--update-env-vars は指定した分だけ追加・上書きし、他は変更しない）。

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format="value(status.url)"
