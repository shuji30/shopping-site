name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

defaults:
  run:
    working-directory: web

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      # npm ci の postinstall（prisma generate）や next build がDATABASE_URLの
      # 存在を前提にしているため、ダミー値を設定する（実接続はしない）。
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
