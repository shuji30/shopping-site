<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>きものレンタル 雅</title>
    <style>
      :root {
        --kon: #1f3a5f;
        --kin: #c9a227;
        --washi: #f7f4ee;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--kon);
        color: var(--washi);
        font-family:
          "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .brand {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .sub {
        margin-top: 8px;
        font-size: 12px;
        letter-spacing: 0.3em;
        color: var(--kin);
      }
      .msg {
        margin-top: 28px;
        font-size: 14px;
        line-height: 1.8;
        color: rgba(247, 244, 238, 0.8);
        max-width: 20rem;
      }
      .dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 3px;
        border-radius: 50%;
        background: var(--kin);
        animation: blink 1.2s infinite ease-in-out both;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">雅</div>
      <div class="sub">KIMONO RENTAL</div>
      <p class="msg">
        サーバーに接続しています…<br />
        接続できない場合は、ネットワーク環境をご確認ください。
      </p>
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </main>
    <!--
      これは server.url 未設定時に表示されるオフライン用シェル。
      capacitor.config.ts の server.url に公開URLを設定すると、
      アプリ起動時にそのサーバー版（Next.js）が読み込まれる。
    -->
  </body>
</html>
